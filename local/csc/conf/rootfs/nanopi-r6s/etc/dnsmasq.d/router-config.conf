# router-config: ipv6-mode=relay
# router-config: ipv6-relay-wan-interface=wan

interface=br0
bind-interfaces

port=53
no-resolv
no-hosts
server=127.0.0.1#5353
server=::1#5353

dhcp-range=192.168.6.100,192.168.6.250,12h
dhcp-option=3,192.168.6.1
dhcp-option=6,192.168.6.1

# ipv6 relay mode handled by external services

dhcp-host=20:76:93:22:a8:87,192.168.6.60,OpenWrt
dhcp-host=2c:cf:67:10:93:d9,192.168.6.45,raspberrypi
dhcp-host=c6:48:3d:b7:56:7f,192.168.6.20,photonicat2
dhcp-host=dc:a6:32:91:30:99,192.168.6.44,pikvm
dhcp-host=fc:34:97:0e:e8:8d,192.168.6.51,tuf
log-dhcp
