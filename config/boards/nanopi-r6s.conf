# OLD PRE-CONFIG (disabled 2026-06-20): copies rootfs snapshot + installs
# first-boot apply-running-config.service. Replaced by route-config-provision
# (harness set2 / RouterPlane/harness#71). Restore when returning to prebaked images.
: <<'DISABLED_PRE_CONFIG'
function post_family_tweaks__nanopi_r6s_install_running_config_firstboot() {
	display_alert "$BOARD" "Installing first-boot running config apply service" "info"

	local payload_src="${SRC}/local/csc/conf/rootfs/nanopi-r6s"
	local payload_dst="${SDCARD}/usr/local/share/nanopi-r6s-running-config/rootfs"
	local script_path="${SDCARD}/usr/local/sbin/nanopi-r6s-apply-running-config"
	local service_path="${SDCARD}/etc/systemd/system/nanopi-r6s-apply-running-config.service"

	if [[ ! -d "${payload_src}" ]]; then
		display_alert "$BOARD" "Running config payload not found at ${payload_src}" "wrn"
		return 0
	fi

	run_host_command_logged mkdir -p "${payload_dst}" "${SDCARD}/usr/local/sbin" "${SDCARD}/etc/systemd/system"
	run_host_command_logged rsync -a --delete --chown=root:root "${payload_src}/" "${payload_dst}/"

	cat > "${script_path}" <<-'EOF'
		#!/usr/bin/env bash
		set -euo pipefail

		PAYLOAD="/usr/local/share/nanopi-r6s-running-config/rootfs"
		STATE_DIR="/var/lib/nanopi-r6s-running-config"
		STAMP="${STATE_DIR}/applied"
		LOG="/var/log/nanopi-r6s-running-config.log"

		mkdir -p "${STATE_DIR}"
		exec >>"${LOG}" 2>&1

		echo "[$(date -Is)] applying NanoPi R6S running config"

		if [[ -e "${STAMP}" ]]; then
			echo "already applied"
			exit 0
		fi

		if [[ ! -d "${PAYLOAD}" ]]; then
			echo "missing payload: ${PAYLOAD}" >&2
			exit 1
		fi

		cp -a "${PAYLOAD}/." /

		if compgen -G "/etc/NetworkManager/system-connections/*.nmconnection" >/dev/null; then
			chown root:root /etc/NetworkManager/system-connections/*.nmconnection
			chmod 600 /etc/NetworkManager/system-connections/*.nmconnection
		fi

		if compgen -G "/usr/local/etc/xray/conf/*.json" >/dev/null; then
			chown root:root /usr/local/etc/xray/conf/*.json
			chmod 644 /usr/local/etc/xray/conf/*.json
		fi

		if [[ -f /usr/local/sbin/xray-runner ]]; then
			chown root:root /usr/local/sbin/xray-runner
			chmod 755 /usr/local/sbin/xray-runner
		fi

		if command -v systemctl >/dev/null 2>&1; then
			systemctl daemon-reload || true
			systemctl restart systemd-modules-load.service || true
			systemctl restart systemd-sysctl.service || true
		fi

		if command -v sysctl >/dev/null 2>&1; then
			sysctl --system || true
		fi

		date -Is > "${STAMP}"
		systemctl disable nanopi-r6s-apply-running-config.service >/dev/null 2>&1 || true
		echo "[$(date -Is)] NanoPi R6S running config applied"
	EOF
	chmod 755 "${script_path}"

	cat > "${service_path}" <<-'EOF'
		[Unit]
		Description=Apply NanoPi R6S running-machine config snapshot
		DefaultDependencies=no
		After=local-fs.target
		Before=network-pre.target NetworkManager.service systemd-networkd.service systemd-networkd-wait-online.service firewalld.service nftables.service netfilter-persistent.service dnsmasq.service unbound.service dnscrypt-proxy.service nginx.service xray.service smbd.service nmbd.service multi-user.target
		ConditionPathExists=/usr/local/share/nanopi-r6s-running-config/rootfs
		ConditionPathExists=!/var/lib/nanopi-r6s-running-config/applied

		[Service]
		Type=oneshot
		ExecStart=/usr/local/sbin/nanopi-r6s-apply-running-config

		[Install]
		WantedBy=multi-user.target
	EOF

	chroot_sdcard systemctl --no-reload enable nanopi-r6s-apply-running-config.service
}
DISABLED_PRE_CONFIG
